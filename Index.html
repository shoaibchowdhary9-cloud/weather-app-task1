<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App - Shoaib</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#00b4db,#0083b0);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{background:white;width:100%;max-width:400px;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center}
h1{color:#0083b0;margin-bottom:20px}
.search-box{display:flex;gap:10px;margin-bottom:15px}
.search-box input{flex:1;padding:12px;border-radius:10px;border:1px solid #ccc;outline:none}
.search-box button{padding:12px 20px;border:none;background:#0083b0;color:white;border-radius:10px;cursor:pointer}
.error{color:red;font-size:14px;min-height:18px;margin-bottom:10px}
.weather-card{margin-top:20px;padding:20px;background:#f7f9fc;border-radius:15px}
.hidden{display:none}
#temp{font-size:42px;margin:10px 0}
.details{display:flex;justify-content:space-around;margin-top:15px}
.details span{color:#777;font-size:11px}
.details p{font-weight:bold;margin-top:5px}
</style>
</head>
<body>
<div class="container">
<h1>Weather App</h1>
<div class="search-box">
<input id="city" placeholder="Enter city e.g. Hyderabad">
<button id="btn">Search</button>
</div>
<p id="error" class="error"></p>
<div id="card" class="weather-card hidden">
<h2 id="cityName"></h2>
<h3 id="temp"></h3>
<p id="cond" style="text-transform:capitalize"></p>
<div class="details">
<div><span>HUMIDITY</span><p id="hum"></p></div>
<div><span>WIND</span><p id="wind"></p></div>
<div><span>FEELS LIKE</span><p id="feels"></p></div>
</div>
</div>
</div>
<script>
const cityInp=document.getElementById("city");
const btn=document.getElementById("btn");
const error=document.getElementById("error");
const card=document.getElementById("card");

async function getWeather(city){
 if(!city){error.textContent="Please enter city name";return;}
 error.textContent="Loading...";
 try{
  const geoRes=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
  const geoData=await geoRes.json();
  if(!geoData.results) throw new Error("City not found");
  const {latitude,longitude,name,country}=geoData.results[0];
  const weatherRes=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,weather_code`);
  const weather=await weatherRes.json();
  const curr=weather.current;
  
  const codes={0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",51:"Light drizzle",61:"Slight rain",71:"Slight snow",95:"Thunderstorm"};
  
  document.getElementById("cityName").textContent=`${name}, ${country}`;
  document.getElementById("temp").textContent=`${Math.round(curr.temperature_2m)}°C`;
  document.getElementById("cond").textContent=codes[curr.weather_code]||"Cloudy";
  document.getElementById("hum").textContent=`${curr.relative_humidity_2m}%`;
  document.getElementById("wind").textContent=`${curr.wind_speed_10m} km/h`;
  document.getElementById("feels").textContent=`${Math.round(curr.apparent_temperature)}°C`;
  card.classList.remove("hidden");
  error.textContent="";
 }catch(e){
  card.classList.add("hidden");
  error.textContent="Invalid city name! Try Hyderabad, Mumbai, Delhi";
 }
}
btn.addEventListener("click",()=>getWeather(cityInp.value.trim()));
cityInp.addEventListener("keypress",e=>{if(e.key==="Enter") getWeather(cityInp.value.trim())});
getWeather("Hyderabad");
</script>
</body>
</html>
